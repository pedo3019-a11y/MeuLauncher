plugins { id 'com.android.application' }

android {
    namespace 'com.meulauncher'
    compileSdk 34
    defaultConfig {
        applicationId "com.meulauncher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
